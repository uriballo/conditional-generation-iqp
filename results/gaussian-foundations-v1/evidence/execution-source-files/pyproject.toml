[project]
name = "iqp-cond"
version = "0.1.0"
description = "Classically trainable conditional IQP generation with product-state encodings."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12.0",
    "fsspec>=2026.2.0",
    "h5py>=3.14.0",
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "matplotlib>=3.11.0",
    "networkx>=3.5",
    "numpy>=2.0",
    "optax>=0.2.8",
    "pennylane>=0.45.0",
    "scipy>=1.16.0",
    "scikit-learn>=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iqp_cond"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/iqp_cond/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
