[project]
name = "conditional-generation-iqp"
version = "0.2.0"
description = "Paper and reproducible numerical experiments for conditional IQP Born machines."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "iqp-cond",
    "jax>=0.10.1",
    "optax>=0.2.8",
    "matplotlib>=3.11.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
hpo = ["optuna>=4.0"]

# Paper reproduction workspace; install the exact recorded library submodule.
[tool.uv]
package = false

[tool.uv.sources]
iqp-cond = { path = "iqp-cond", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
