[project]
name = "conditional-generation-iqp"
version = "0.2.0"
description = "Experiments for conditional generation with IQP circuits."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "iqp-cond",
    "matplotlib>=3.11.0",
    "numpy>=2.0",
]

# The repository is an experiment workspace, not a package.  The `iqp-cond`
# library is installed editable from the submodule at iqp-cond, which tracks the
# library's main branch; jax, optax, and pennylane arrive through it.
[tool.uv]
package = false

[tool.uv.sources]
iqp-cond = { path = "iqp-cond", editable = true }

# Planned, not installed yet:
#   tracking = ["mlflow>=2.0"]   # mirror run directories into MLflow
#   hpo = ["optuna>=4.0"]        # sweep runner in experiments/common/sweeps.py

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["experiments/tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.17",
]
